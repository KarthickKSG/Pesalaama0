version: '3.9'
services:
  web:
    build: .
    command: pnpm --filter @app/web dev
    ports: ["3000:3000"]
    environment: ["NEXT_PUBLIC_API_URL=http://localhost:4000"]
  api:
    build: .
    command: pnpm --filter @app/api dev
    ports: ["4000:4000"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=secret
      - JWT_REFRESH_SECRET=refresh
  db:
    image: postgres:16
    environment: ["POSTGRES_PASSWORD=postgres","POSTGRES_DB=app"]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
